[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "standalone-google-lens-scrapling-worker"
version = "0.1.0"
description = "Redis Streams worker for an explicitly authorized Google Lens Scrapling adapter"
requires-python = ">=3.12,<3.13"
dependencies = [
    "redis==5.2.1",
    "scrapling[fetchers]==0.4.15",
]

[project.optional-dependencies]
dev = [
    "mypy==1.15.0",
    "pytest==8.3.5",
    "pytest-asyncio==0.25.3",
]

[project.scripts]
scrapling-worker = "scrapling_worker.__main__:main"

[tool.setuptools.packages.find]
include = ["scrapling_worker*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
files = ["scrapling_worker"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
