name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release version and main history
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          APP_VERSION="${RELEASE_TAG#v}"
          node -e 'const fs=require("node:fs"); const p=JSON.parse(fs.readFileSync("package.json")); if (p.version !== process.argv[1]) throw new Error("package.json version does not match tag");' "$APP_VERSION"
          python -c 'import pathlib, re, sys; text=pathlib.Path("pyproject.toml").read_text(); match=re.search(r"(?m)^version = \"([^\"]+)\"$", text); assert match and match.group(1)==sys.argv[1], "pyproject.toml version does not match tag"' "$APP_VERSION"
          grep -Fq "## [$APP_VERSION] - " CHANGELOG.md
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish API image
        env:
          IMAGE: ghcr.io/arslanbasharat-o-o/google-lens-api
          APP_VERSION: ${{ github.ref_name }}
        run: |
          APP_VERSION="${APP_VERSION#v}"
          docker buildx build --platform linux/amd64 --push \
            --build-arg APP_VERSION="$APP_VERSION" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --tag "$IMAGE:$APP_VERSION" \
            --tag "$IMAGE:latest" .

      - name: Build and publish Scrapling Chrome worker image
        env:
          IMAGE: ghcr.io/arslanbasharat-o-o/google-lens-scrapling-worker
          APP_VERSION: ${{ github.ref_name }}
        run: |
          APP_VERSION="${APP_VERSION#v}"
          docker buildx build --platform linux/amd64 --push \
            --file Dockerfile.scrapling-worker \
            --build-arg APP_VERSION="$APP_VERSION" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --tag "$IMAGE:$APP_VERSION" \
            --tag "$IMAGE:latest" .

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Google Lens API $GITHUB_REF_NAME" \
              --generate-notes
          fi
