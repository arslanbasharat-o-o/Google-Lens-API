services:
  lens-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      LENS_ADAPTER: mock
      MAX_IMAGE_BYTES: 10485760
      MAX_BATCH_SIZE: 10
      MAX_QUEUE_SIZE: 100
      WORKER_CONCURRENCY: 2
      SEARCH_SYNC_WAIT_MS: 1000
      GOOGLE_LENS_LIVE_ENABLED: "false"
      GOOGLE_LENS_LIVE_AUTHORIZED: "false"
    restart: unless-stopped
